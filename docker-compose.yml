services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seatforge
    ports: ["5432:5432"]
    volumes: [seatforge_pg:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seatforge?schema=public
      JWT_SECRET: local-docker-secret-change-me
      HOLD_TTL_SECONDS: 600
      WAITLIST_OFFER_TTL_SECONDS: 300
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports: ["3000:3000"]
volumes:
  seatforge_pg:
